services:
  logvault:
    build: .
    container_name: logvault
    ports:
      - "8080:8080"
    volumes:
      ## Format should be <host-logdir-path>:/app/logs/<service-or-appname>
      - /var/log:/app/logs/system:ro
      ## Optional: mount a local logo file for LOGO_PATH below
      - ./app/logo.png:/app/logo.png:ro
    environment:
      # ── Optional: Base path for reverse proxy subpath ─────────────────
      # Set this if serving under a subpath e.g. https://host/logvault/
      BASE_PATH: "/logvault"

      # ── Optional: Basic Auth ──────────────────────────────────────────
      # Remove or leave blank to run without authentication.
      # Both AUTH_USER and AUTH_PASSWORD must be set to enable auth.
      AUTH_USER: "admin"
      AUTH_PASSWORD: "admin"

      # ── Optional: custom port (default 8080) ─────────────────────────
      # PORT: 9000

      # ── Optional: custom logo ─────────────────────────────────────────
      # Option A: an image URL or data: URI, used as-is in <img src>.
      # LOGO_URL: "https://example.com/logo.png"
      # Option B: a file mounted into the container (see volumes above) —
      # served publicly at /logo and takes priority over LOGO_URL.
      LOGO_PATH: "/app/logo.png"

      # ── Optional: session lifetime in hours (default 8) ───────────────
      #SESSION_TTL_HOURS: 12

      # ── Optional: login lockout after repeated failures ───────────────
      # Global counter (not per-IP/user) — resets on container restart.
      MAX_LOGIN_ATTEMPTS: 5
      LOGIN_LOCKOUT_HOURS: 12
    restart: unless-stopped
    healthcheck:
      # scratch image has no shell/wget — binary checks its own /health
      test: ["CMD", "/logvault", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
